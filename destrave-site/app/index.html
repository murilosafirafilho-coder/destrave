/* ---------- Suporte ---------- */
let SUP={busy:false,ctl:null,form:null,sent:null,err:"",ia:null,lista:null,draft:""};
// Inatividade: contada a partir da última mensagem (da pessoa ou do assistente) ou do que a pessoa digitou.
const SUP_PING=3*60000,SUP_AVISO=4*60000,SUP_FIM=5*60000,SUP_MAX_CHATS=30;
const SUP_TXT_PING="Tem alguém aí?",SUP_TXT_AVISO="Caso não haja resposta, o chat será encerrado em 1 minuto...";
const SUP_STATUS={inatividade:"Encerrada por inatividade",voce:"Encerrada por você",equipe:"Enviada à equipe"};
function supNova(){return{id:"C"+Date.now().toString(36).toUpperCase(),inicio:Date.now(),msgs:[],lastAt:null,ping:false,aviso:false,fechada:null}}
function supGarante(){if(!S.sup||!S.sup.id)S.sup=Object.assign(supNova(),{msgs:(S.sup&&S.sup.msgs)||[]});S.chats=Array.isArray(S.chats)?S.chats:[];return S.sup}
const supComecou=c=>(c.msgs||[]).some(m=>m.r==="u");
// Guarda a conversa em "Meus chats" e a marca como encerrada (uma vez só).
function supArquiva(motivo,extra){
  const c=supGarante();if(c.fechada||!supComecou(c))return;
  c.fechada={motivo,em:Date.now(),extra:extra||""};
  S.chats=[JSON.parse(JSON.stringify(c))].concat(S.chats.filter(x=>x.id!==c.id)).slice(0,SUP_MAX_CHATS);
  tlog("suporte_conversa_"+motivo);save();
}
function supAtividade(){const c=supGarante();c.lastAt=Date.now();c.ping=false;c.aviso=false}
// Relógio de inatividade: roda a cada segundo enquanto há uma conversa aberta e o assistente não está respondendo.
function supTick(){
  const c=S.sup;if(!c||!c.id||c.fechada||!supComecou(c)||!c.lastAt||SUP.busy||SUP.form)return;
  const el=Date.now()-c.lastAt;let mudou=false;
  if(el>=SUP_FIM){c.msgs.push({r:"sys",t:"Conversa encerrada por inatividade. Ela fica salva em Meus chats.",auto:1});supArquiva("inatividade");mudou=true}
  else if(el>=SUP_AVISO&&!c.aviso){if(!c.ping){c.msgs.push({r:"a",t:SUP_TXT_PING,auto:1});c.ping=true}c.msgs.push({r:"a",t:SUP_TXT_AVISO,auto:1});c.aviso=true;mudou=true}
  else if(el>=SUP_PING&&!c.ping){c.msgs.push({r:"a",t:SUP_TXT_PING,auto:1});c.ping=true;mudou=true}
  if(mudou){save();if(S.view==="suporte"&&!SUP.lista&&!SUP.sent)rSuporte()}
}
setInterval(supTick,1000);
function openSupport(){S.supBack=S.view==="suporte"?(S.supBack||"welcome"):S.view;supGarante();SUP.form=null;SUP.sent=null;SUP.err="";SUP.lista=null;go("suporte");supTick()}
async function supIA(){if(SUP.ia===null){try{SUP.ia=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){SUP.ia=null}}return SUP.ia}
const supLimpa=t=>String(t||"").replace(/\[\[[\s\S]*$/,"").trim();
const supBolha=m=>m.r==="sys"?`<div class="msg sys">${esc(m.t)}</div>`:`<div class="msg ${m.r==="u"?"u":"a"}">${esc(m.t)}</div>`;
const supQuando=ts=>new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const supSair=()=>{if(SUP.ctl)SUP.ctl.abort();SUP.lista=null;go(S.supBack&&S.supBack!=="suporte"?S.supBack:"welcome")};
function rSuporte(){
  $("#tabs").hidden=true;$("#ring").hidden=true;$("#hsub").textContent="Suporte";
  const old=$("#supIn");if(old)SUP.draft=old.value;
  const c=supGarante(),M=c.msgs,turnos=M.filter(m=>m.r==="u").length,fechada=!!c.fechada;
  if(SUP.sent){
    main.innerHTML=`<div class="screen"><div class="card"><p class="eyebrow">Chamado enviado</p><h2>Recebemos sua mensagem</h2><p class="small">A equipe responde no e-mail <b>${esc(SUP.sent.email)}</b>. Número do chamado: <b>${esc(SUP.sent.id)}</b>.</p><p class="small muted">A conversa fica salva em Meus chats.</p></div><button class="btn" id="supBack" type="button">Voltar ao app</button></div>`;
    $("#supBack").onclick=()=>{SUP.sent=null;supSair()};return;
  }
  if(SUP.form){rSupForm();return}
  if(SUP.lista){rSupLista();return}
  main.innerHTML=`<div class="screen">
   <div class="card"><div class="dayhead"><h2>Falar com o suporte</h2><button class="link" id="supBack" type="button">Voltar</button></div>
    <p class="small muted">Um assistente com IA tira dúvidas sobre como usar o app. Se ele não resolver, você envia sua mensagem para a equipe.</p>
    <button class="link" id="supChats" type="button" style="align-self:flex-start">Meus chats${S.chats.length?` (${S.chats.length})`:""}</button></div>
   <div class="card"><div class="chat" id="chat" aria-live="polite">
    <div class="msg a">Oi! Me conte sua dúvida sobre o app. Por exemplo: como marcar tarefas, mudar a data de início ou mexer na rotina.</div>
    ${M.map(supBolha).join("")}
    ${SUP.busy?`<div class="msg a wait" id="supLive">Pensando…</div>`:""}
   </div>
   ${!M.length&&!SUP.busy?`<div class="sugs" style="margin-top:12px">${SUP_SUGS.map((x,i)=>`<button type="button" data-sug="${i}">${esc(x)}</button>`).join("")}</div>`:""}
   ${SUP.err?`<p class="qerr" role="alert" style="margin-top:10px">${esc(SUP.err)}</p>`:""}
   ${fechada?`<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px"><p class="small muted">Esta conversa foi encerrada. Para tirar outra dúvida, comece uma nova conversa.</p><button class="btn" id="supNova" type="button">Nova conversa</button></div>`
   :turnos>=SUP_MAX_TURNOS?`<p class="note" style="margin-top:10px">Esta conversa ficou longa. Para continuar, fale com a equipe ou comece uma nova conversa.</p>`:`
   <form class="chatin" id="supF" style="margin-top:12px" novalidate>
    <label class="ql" for="supIn" style="font-size:.9rem">Sua mensagem</label>
    <textarea id="supIn" maxlength="${SUP_MAX_MSG}" placeholder="Escreva sua dúvida" ${SUP.busy?"disabled":""}>${esc(SUP.draft)}</textarea>
    <div class="row">${SUP.busy?`<button type="button" class="btn ghost" id="supStop">Parar</button>`:`<button type="submit" class="btn">Enviar</button>`}</div>
   </form>`}
   ${!fechada&&supComecou(c)&&!SUP.busy?`<div class="row" style="margin-top:8px"><button class="btn ghost" id="supEnd" type="button" style="padding:12px 15px">Encerrar conversa</button></div>`:""}</div>
   ${fechada?"":`<div class="card"><p class="eyebrow">Não resolveu?</p><p class="small">Envie sua mensagem para a equipe. A resposta chega no seu e-mail.</p><button class="btn ghost" id="supHuman" type="button">Falar com a equipe</button></div>`}
  </div>`;
  const ch=$("#chat");ch.lastElementChild&&ch.lastElementChild.scrollIntoView({block:"nearest"});
  $("#supBack").onclick=supSair;
  $("#supChats").onclick=()=>{SUP.lista={ver:null};rSuporte()};
  if($("#supHuman"))$("#supHuman").onclick=()=>supAbrirForm("");
  const nova=()=>{if(SUP.ctl)SUP.ctl.abort();supArquiva("voce");S.sup=supNova();SUP.err="";SUP.draft="";save();rSuporte()};
  if($("#supEnd"))$("#supEnd").onclick=()=>{if(SUP.ctl)SUP.ctl.abort();c.msgs.push({r:"sys",t:"Conversa encerrada por você. Ela fica salva em Meus chats.",auto:1});supArquiva("voce");SUP.err="";SUP.draft="";save();rSuporte()};
  if($("#supNova"))$("#supNova").onclick=nova;
  main.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>supEnviar(SUP_SUGS[+b.dataset.sug]));
  if($("#supStop"))$("#supStop").onclick=()=>{if(SUP.ctl)SUP.ctl.abort()};
  if($("#supF")){
    const ta=$("#supIn");
    ta.addEventListener("input",()=>{SUP.draft=ta.value;if(supComecou(c)&&!c.fechada)supAtividade()});
    ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#supF").requestSubmit()}});
    $("#supF").onsubmit=e=>{e.preventDefault();const t=ta.value.trim();if(!t){SUP.err="Escreva sua dúvida antes de enviar.";rSuporte();return}ta.value="";SUP.draft="";supEnviar(t)};
    if(!SUP.busy)ta.focus();
  }
}

function rSupLista(){

     <button class="btn" id="lsNova" type="button">${supComecou(supGarante())&&!S.sup.fechada?"Voltar à conversa atual":"Nova conversa"}</button></div>`;

async function supEnviar(texto){
  if(SUP.busy)return;
  const c=supGarante();if(c.fechada)return;
  texto=String(texto).slice(0,SUP_MAX_MSG);SUP.err="";
  const M=c.msgs;M.push({r:"u",t:texto});supAtividade();save();
  const sample=await supIA();
  if(!sample){M.push({r:"sys",t:"O assistente com IA não está disponível neste acesso (é preciso estar logado no Claude). Você pode falar direto com a equipe."});supAtividade();save();supAbrirForm("");return}
  SUP.busy=true;rSuporte();
  const ctl=new AbortController();SUP.ctl=ctl;
  // instruções + contexto num turno inicial; depois a conversa (últimas 16 mensagens, sem os avisos automáticos)
  const conv=M.filter(m=>m.r!=="sys"&&!m.auto).slice(-16).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
  while(conv.length&&conv[0].role!=="user")conv.shift();
  const input=[{role:"user",content:SUP_REGRAS+"\n\nCONTEXTO DA PESSOA AGORA: "+supCtx()+"\n\nA conversa com a pessoa vem a seguir."}].concat(conv);
  let enc=null;
  try{
    const r=await sample(input,{modelTier:"quick",cache:false,signal:ctl.signal,onText:({text})=>{const el=$("#supLive");if(el){el.classList.remove("wait");el.textContent=supLimpa(text)||"Pensando…"}}});
    const m=/\[\[ENCAMINHAR:?\s*([^\]]*)\]\]/.exec(r.text);if(m)enc=m[1].trim()||"Dúvida sobre o app";
    const limpo=supLimpa(r.text);
    M.push({r:"a",t:limpo||(enc?"Vou abrir o formulário para a equipe.":"Não consegui responder. Você pode falar com a equipe.")});
    if(r.truncated)M.push({r:"sys",t:"A resposta foi cortada. Se precisar, pergunte de novo de forma mais curta."});
  }catch(e){
    const parcial=supLimpa(e&&e.text);
    if(parcial)M.push({r:"a",t:parcial});
    if(!(e&&e.code==="cancelled")){
      if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){SUP.ia=false;M.push({r:"sys",t:"O assistente com IA não foi autorizado neste acesso. Você pode falar direto com a equipe."})}
      else SUP.err=SUP_FAIL[e&&e.code]||"O assistente não respondeu agora. Tente de novo ou fale com a equipe.";
    }
  }
  SUP.busy=false;SUP.ctl=null;supAtividade();save();
  if(S.view!=="suporte")return;
  if(enc){S.T&&tlog("suporte_ia_encaminhou");supAbrirForm(enc);return}
  if(SUP.ia===false&&!SUP.form){supAbrirForm("");return}
  rSuporte();
}
function supAbrirForm(assunto){
  const us=(supGarante().fechada?[]:S.sup.msgs).filter(m=>m.r==="u").map(m=>m.t);
  SUP.form={assunto:assunto||"",desc:us.join("\n\n").slice(0,1000),email:S.a.email||"",conversa:true,err:""};
  if(S.view==="suporte")rSuporte();
}

  main.innerHTML=`<div class="screen">

    ${temConv?`<label class="opt" style="display:flex;gap:8px;align-items:flex-start;font-size:.88rem"><input type="checkbox" id="tk_cv" ${F.conversa?"checked":""} style="width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--accent)"> <span>Anexar a conversa com o assistente, para a equipe entender o contexto</span></label>`:""}
    <p class="small muted">Enviamos à equipe seu nome, o e-mail acima, esta mensagem e a situação do seu desafio (dia atual e se o plano foi gerado). Seu telefone e suas respostas do questionário não vão.</p>
    <p class="qerr" id="tk_err" role="alert" ${F.err?"":"hidden"}>${esc(F.err)}</p>
    <div class="row"><button type="button" class="btn ghost" id="tk_back">Voltar</button><button type="submit" class="btn" id="tk_send">Enviar para a equipe</button></div>
   </form></div>`;
  const keep=()=>{F.assunto=$("#tk_as").value;F.desc=$("#tk_ds").value;F.email=$("#tk_em").value;F.conversa=$("#tk_cv")?$("#tk_cv").checked:false};
  $("#tk_ds").addEventListener("input",e=>{const r=1000-e.target.value.length;$("#tk_c").textContent=r+"/1000"});
  $("#tk_back").onclick=()=>{SUP.form=null;if(supComecou(S.sup)&&!S.sup.fechada)supAtividade();save();rSuporte()};
  $("#tk_as").focus();
  $("#tkF").onsubmit=async e=>{
    e.preventDefault();keep();
    const err=m=>{F.err=m;const x=$("#tk_err");x.hidden=!m;x.textContent=m};
    if(!F.assunto.trim())return err("Escreva o assunto.");
    if(F.desc.trim().length<10)return err("Explique o problema com um pouco mais de detalhe.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(F.email.trim()))return err("Confira o e-mail. Exemplo: nome@email.com");
    $("#tk_send").disabled=true;$("#tk_send").textContent="Enviando…";
    const r=await supGravar(F);
    if(!r.ok){$("#tk_send").disabled=false;$("#tk_send").textContent="Enviar para a equipe";return err(r.msg)}
    SUP.form=null;SUP.sent={id:r.id,email:F.email.trim()};
    if(supComecou(S.sup)&&!S.sup.fechada){S.sup.msgs.push({r:"sys",t:`Mensagem enviada à equipe (chamado nº ${r.id}).`,auto:1});supArquiva("equipe","chamado nº "+r.id)}
    S.sup=supNova();SUP.draft="";save();rSuporte();
  };
}
async function supGravar(F){
  if(!DB||!UID)return{ok:false,msg:"Não foi possível enviar daqui: é preciso abrir o app logado no Claude. Tente de novo depois de entrar."};
  const id="S"+Date.now().toString(36).toUpperCase().slice(-6);
  const conv=F.conversa&&!S.sup.fechada?(S.sup.msgs||[]).filter(m=>m.r!=="sys"&&!m.auto).slice(-16).map(m=>(m.r==="u"?"Pessoa: ":"Assistente: ")+m.t).join("\n").slice(0,4000):"";
  const ch={id,criadoEm:Date.now(),assunto:F.assunto.trim().slice(0,80),descricao:F.desc.trim().slice(0,1000),emailResposta:F.email.trim(),conversa:conv,situacao:supCtx(),status:"novo"};
  try{
    const ref=DB.doc("suporte/"+UID),snap=await ref.get(),old=snap&&snap.exists?(snap.data().chamados||[]):[];
    await ref.set({nome:S.a.nome||"",email:F.email.trim(),atualizadoEm:Date.now(),chamados:old.concat([ch]).slice(-20)});
    tlog("suporte_chamado_enviado");track();
    return{ok:true,id};
  }catch(e){
    return{ok:false,msg:e&&e.code==="invalid_argument"?"Não foi possível enviar sua mensagem. Recarregue a página e tente de novo.":"Não foi possível enviar agora. Tente de novo em instantes."};
  }
}

/* ---------- Painel do teste (só o dono do app vê) ---------- */
// Botões "Abrir painel do teste" ocultos por enquanto. Para mostrar de novo, troque para true.
const MOSTRAR_PAINEL=false;
const PAINEL={unsub:null,unsubSup:null,docs:[],sup:[],err:"",open:{}};
function rPainel(){
  $("#tabs").hidden=true;$("#ring").hidden=true;$("#hsub").textContent="Painel do teste";
  if(!OWNER){main.innerHTML=`<div class="screen"><div class="card"><h2>Painel do teste</h2><p class="small">Só o responsável pelo teste pode ver este painel.</p><button class="btn ghost" id="pBack">Voltar</button></div></div>`;$("#pBack").onclick=()=>go(S.plan?"plan":"welcome");return}
  if(DB&&!PAINEL.unsub){
    PAINEL.unsubSup=DB.collection("suporte").onSnapshot(snap=>{PAINEL.sup=snap.docs.map(d=>Object.assign({uid:d.id},d.data()));if(S.view==="painel")drawPainel()},()=>{PAINEL.unsubSup=null});
    PAINEL.unsub=DB.collection("testers").onSnapshot(snap=>{PAINEL.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));PAINEL.err="";if(S.view==="painel")drawPainel()},e=>{PAINEL.err="A conexão com a base caiu. Volte e abra o painel de novo.";PAINEL.unsub=null;if(S.view==="painel")drawPainel()});
  }
  drawPainel();
}
function ago(ts){if(!ts)return"—";const m=Math.round((Date.now()-ts)/60000);if(m<1)return"agora";if(m<60)return`há ${m} min`;const h=Math.round(m/60);if(h<24)return`há ${h} h`;return`há ${Math.round(h/24)} d`}
function drawPainel(){
  const D=PAINEL.docs.slice().sort((a,b)=>(b.atualizadoEm||0)-(a.atualizadoEm||0));
  const cnt=f=>D.filter(f).length;
  const funil=[
    ["Criaram conta",D.length],
    ["Concluíram o questionário",cnt(d=>d.questionario&&d.questionario.concluidoEm)],
    ["Receberam plano gerado pela IA",cnt(d=>d.plano&&d.plano.fonte==="ia")],
    ["Concluíram o Dia 1",cnt(d=>d.dias&&d.dias.concluidos>=1)],
    ["Concluíram os 7 dias",cnt(d=>d.dias&&d.dias.concluidos>=7)],
    ["Enviaram a avaliação",cnt(d=>d.avaliacao)]
  ];
  const max=Math.max(1,D.length);
  const quizMin=d=>{const t=d.questionario&&d.questionario.tempos;if(!t)return null;const s=Object.values(t).reduce((a,b)=>a+(+b||0),0);return s?Math.round(s/60):null};
  main.innerHTML=`<div class="screen">
   <div class="card"><div class="dayhead"><h2>Painel do teste</h2><span class="small muted">${DB?"Atualiza sozinho":"Base indisponível"}</span></div>
    <p class="small muted">Só você vê este painel. Cada testador aparece depois de criar a conta e aceitar participar do teste.</p>
    ${PAINEL.err?`<div class="alert">${esc(PAINEL.err)}</div>`:""}
    <div class="facts">${funil.map(([l,v])=>`<div class="fact" style="grid-template-columns:1fr auto"><span>${l}</span><b>${v}</b><small><span class="pbar"><i style="width:${Math.round(v/max*100)}%"></i></span></small></div>`).join("")}</div></div>
   ${(()=>{const T=[];PAINEL.sup.forEach(u=>(u.chamados||[]).forEach(c=>T.push(Object.assign({uid:u.uid,nome:u.nome},c))));T.sort((a,b)=>((b.status==="novo")-(a.status==="novo"))||(b.criadoEm-a.criadoEm));const novos=T.filter(c=>c.status==="novo").length;
     return `<div class="card"><div class="dayhead"><h3>Chamados de suporte</h3><span class="small muted">${novos} em aberto</span></div>${T.length?T.slice(0,30).map(c=>`<div class="tk"><div class="dayhead"><b>${esc(c.assunto)}</b><span class="tag ${c.status==="novo"?"main":""}">${c.status==="novo"?"Em aberto":"Resolvido"}</span></div><p class="small muted">${esc(c.nome||"Sem nome")} · ${esc(c.emailResposta||"")} · ${new Date(c.criadoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})} · nº ${esc(c.id)}</p><p class="small" style="white-space:pre-wrap">${esc(c.descricao)}</p>${c.conversa?`<details class="small"><summary>Conversa com o assistente</summary><p style="white-space:pre-wrap">${esc(c.conversa)}</p></details>`:""}<p class="small muted">${esc(c.situacao||"")}</p>${c.status==="novo"?`<button class="mini" type="button" data-res="${esc(c.uid)}|${esc(c.id)}" style="align-self:flex-start">Marcar como resolvido</button>`:""}</div>`).join(""):`<p class="small">Nenhum chamado ainda.</p>`}</div>`})()}
   ${D.length?D.map(d=>{
     const q=d.questionario||{},pl=d.plano,av=d.avaliacao,g=d.geracao,op=!!PAINEL.open[d.id],qm=quizMin(d);
     return `<div class="card">
      <div class="dayhead"><h3>${esc(d.nome||"Sem nome")}</h3><span class="small muted">ativo ${ago(d.atualizadoEm)}</span></div>
      <p class="small muted">${esc(d.email||"")}${d.telefone?" · "+esc(d.telefone):""}</p>
      <dl class="kv">
       <dt>Questionário</dt><dd>${q.concluidoEm?`concluído${qm?` em ${qm} min`:""}`:`parte ${q.parteNum||"?"} de ${q.partes||"?"} (${esc(q.parteAtual||"")})`}</dd>
       <dt>Plano</dt><dd>${pl?`${pl.fonte==="ia"?"gerado pela IA":"exemplo"}${pl.inicioDesafio?`, Dia 1 em ${pl.inicioDesafio.split("-").reverse().slice(0,2).join("/")}`:""}${pl.pontosRevisao?`, ${pl.pontosRevisao} ponto(s) p/ revisão`:""}`:g&&g.resultado!=="ok"?esc("geração: "+g.resultado+(g.codigo?" ("+g.codigo+")":"")):"ainda não"}</dd>
       <dt>Dias</dt><dd>${d.dias?`${d.dias.concluidos} de 7 concluídos · ${d.dias.marcadas} tarefas marcadas`:"—"}</dd>
       <dt>Rotina</dt><dd>${d.rotina?`${d.rotina.adicionados||0} itens adicionados`:"—"}${d.comecarAgora?" · usou Começar agora":""}</dd>
       <dt>Avaliação</dt><dd>${av?`nota ${av.nota}/10${av.categoria?", mais avançou: "+esc(sphName(av.categoria)):""}`:"ainda não"}</dd>
      </dl>
      ${av&&av.travou?`<p class="small"><b>O que travou:</b> ${esc(av.travou)}</p>`:""}
      <button type="button" class="more" data-pev="${esc(d.id)}" aria-expanded="${op}">${op?"Ocultar atividade":"Ver atividade"}<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      ${op?`<ul class="plain small">${(d.eventos||[]).slice().reverse().slice(0,20).map(ev=>`<li><span class="muted">${new Date(ev.t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span> · ${esc(String(ev.e).replace(/_/g," "))}</li>`).join("")}</ul>`:""}
     </div>`}).join(""):`<div class="card"><p class="small">Nenhum testador ainda. Quando alguém criar a conta no questionário e aceitar participar, aparece aqui na hora.</p></div>`}
   <button class="btn ghost" id="pBack">Voltar</button></div>`;
  $("#pBack").onclick=()=>go(S.plan?"plan":"welcome");
  main.querySelectorAll("[data-pev]").forEach(b=>b.onclick=()=>{PAINEL.open[b.dataset.pev]=!PAINEL.open[b.dataset.pev];drawPainel()});
  main.querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{
    const[uid,id]=b.dataset.res.split("|"),u=PAINEL.sup.find(x=>x.uid===uid);if(!u||!DB)return;
    b.disabled=true;b.textContent="Salvando…";
    try{await DB.doc("suporte/"+uid).update({chamados:(u.chamados||[]).map(c=>c.id===id?Object.assign({},c,{status:"resolvido",resolvidoEm:Date.now()}):c)})}
    catch(e){b.disabled=false;b.textContent="Não salvou. Tentar de novo"}
  });
}

   <div class="card"><p class="eyebrow">Pagamento</p>

   <div class="card"><p class="eyebrow">Privacidade e termos</p>

}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.p;RF={open:false,edit:null,msg:"",ok:"",undo:null};AJ={login:false,confirmDel:false};save();rPlan();window.scrollTo(0,0)});
if(S.view==="gen"){
  if(S.T&&S.T.geracao&&S.T.geracao.resultado==="em andamento")S.T.geracao.resultado="interrompida (página fechada)";
  if(S.pendInicio&&S.plan){S.a.inicio=S.pendInicio;S.pendInicio=null;S.view="plan"}else S.view="review";
}
if(S.view==="plan"&&!S.plan)S.view="welcome";

// Volta do Mercado Pago: ?pagamento=retorno&payment_id=...&status=...
// A URL é limpa e o pagamento é conferido no servidor (os parâmetros sozinhos não liberam nada).
(function(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  if(!q.has("pagamento"))return;
  const pid=q.get("payment_id")||q.get("collection_id")||"";
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  if(S.pago||!(S.plan&&S.src==="ia"))return;
  S.view="compra";COMPRA.retorno={pid:/^\d{1,20}$/.test(pid)?pid:""};COMPRA.estado="verificando";
})();
render();
if(!S.pago&&S.plan&&S.src==="ia"){
  if(COMPRA.retorno)verificarPagamento(COMPRA.retorno.pid,false);
  else if(S.view==="compra")verificarPagamento("",true);
}
